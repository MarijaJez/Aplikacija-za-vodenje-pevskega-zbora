services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: zborissimo
      POSTGRES_USER: zborissimo
      POSTGRES_PASSWORD: zborissimo_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zborissimo -d zborissimo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - zborissimo_postgres_data:/var/lib/postgresql/data
      - ./Data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./Data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - zborissimo_pgadmin_data:/var/lib/pgadmin

volumes:
  zborissimo_postgres_data:
  zborissimo_pgadmin_data:
